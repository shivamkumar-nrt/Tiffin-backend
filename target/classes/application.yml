server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: tiffin-service-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/tiffindb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

whatsapp:
  api:
    enabled: ${WHATSAPP_API_ENABLED:true}
    provider: ${WHATSAPP_API_PROVIDER:generic}
    url: ${WHATSAPP_API_URL:}
    token: ${WHATSAPP_API_TOKEN:}
    instance-id: ${WHATSAPP_INSTANCE_ID:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms

  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    cache-names:
      - activeCombos
      - allCombos
      - menus
      - menuItems
      - prices
      - dashboardStats
      - userBalances

tiffin:
  app:
    jwtSecret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwtExpirationMs: 86400000 # 24 hours
    currencySymbol: "Rs."
    defaultFullPrice: 120.00
    defaultHalfPrice: 80.00

logging:
  level:
    root: INFO
    com.tiffin.system: INFO
